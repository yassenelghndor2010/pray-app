name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack sources
        run: |
          echo "" | base64 -d > src.zip
          unzip -q src.zip -d srcfiles
      - name: Create React Native project
        run: npx --yes @react-native-community/cli@latest init PrayerAlarm --version 0.76.5 --skip-git-init --pm npm
      - name: Install libraries
        working-directory: PrayerAlarm
        run: npm i adhan @notifee/react-native react-native-sound react-native-document-picker @react-native-async-storage/async-storage @react-native-community/geolocation react-native-background-fetch
      - name: Copy and patch sources
        run: python3 srcfiles/patch.py
      - name: Build APK
        working-directory: PrayerAlarm/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PrayerAlarm-apk
          path: PrayerAlarm/android/app/build/outputs/apk/release/app-release.apk
